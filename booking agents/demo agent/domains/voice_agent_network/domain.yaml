domain_id: voice_agent_network
name: Voice Agent Intelligence Network
short_name: VOICE-AIN
version: 0.2.0
mission: >
  Audit, improve, test, document, and commercially qualify the Retell + Cal.com
  voice booking product using the Universal Multi-Agent Network core.
scope:
  - Existing Retell web-call demo (voice-agent/)
  - Independent QA auditor (retell-pet-grooming-qa/)
  - Local market research feedback loop
  - Documentation and recovery assurance
supported_platforms:
  - Retell AI (web call; PSTN optional)
  - Cal.com (availability/book/list/get)
agent_ids:
  - coordinator
  - market-research
  - voice-development
  - integrations
  - testing
  - documentation
uan_aliases:
  "00": coordinator
  "10": voice-development
  "11": market-research
  "20": voice-development
  "40": integrations
  "50": testing
  "70": documentation
workflows:
  - workflows/voice_audit.yaml
  - workflows/prompt_review.yaml
  - workflows/tool_test.yaml
  - workflows/regression.yaml
  - workflows/redteam.yaml
  - workflows/release_readiness.yaml
  - workflows/research_feedback.yaml
  - workflows/documentation_impact.yaml
quality_gates: quality/gates.yaml
evaluations: evaluations/framework.md
memory_scope: project
notes:
  - Provider adapters are the existing QA adapters + Retell/Cal.com dashboards — do not duplicate.
  - Do not invent audio/STT metrics without evidence.
  - Production deploy requires human approval (Gate 11).
