[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retell-pet-grooming-qa"
version = "0.1.0"
description = "Autonomous voice QA auditor for Retell AI pet grooming receptionists"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "retell-sdk>=4.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "openai>=1.40.0",
  "streamlit>=1.28.0",
  "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "adapters*"]
