<!DOCTYPE html>
<html lang="en" data-i18n-title="meta.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Community Church</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo">
        <span class="logo-mark" aria-hidden="true">G</span>
        <span class="logo-text" data-i18n="brand.name"></span>
      </a>
      <nav>
        <ul class="nav" id="main-nav">
          <li><a href="#about" data-i18n="nav.about"></a></li>
          <li><a href="#worship" data-i18n="nav.worship"></a></li>
          <li><a href="#ministries" data-i18n="nav.ministries"></a></li>
          <li><a href="#contact" data-i18n="nav.contact"></a></li>
        </ul>
      </nav>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang-toggle="en">EN</button>
        <button type="button" data-lang-toggle="es">ES</button>
      </div>
      <button class="mobile-menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false">&#9776;</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-glow-2" aria-hidden="true"></div>
      <div class="container hero-content">
        <span class="hero-badge" data-i18n="hero.badge"></span>
        <h1 data-i18n="hero.title"></h1>
        <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
        <div class="hero-actions">
          <a href="#worship" class="btn-primary" data-i18n="hero.cta"></a>
          <a href="#about" class="btn-secondary" data-i18n="hero.cta2"></a>
        </div>
      </div>
    </section>

    <section id="about">
      <div class="container">
        <div class="section-header">
          <span class="section-tag" data-i18n="about.label"></span>
          <h2 data-i18n="about.heading"></h2>
        </div>
        <div class="about-grid">
          <p class="about-text" data-i18n="about.text"></p>
          <div class="about-stats">
            <div class="stat-card">
              <div class="number" data-i18n="about.stat1.number"></div>
              <div class="label" data-i18n="about.stat1.label"></div>
            </div>
            <div class="stat-card">
              <div class="number" data-i18n="about.stat2.number"></div>
              <div class="label" data-i18n="about.stat2.label"></div>
            </div>
            <div class="stat-card">
              <div class="number" data-i18n="about.stat3.number"></div>
              <div class="label" data-i18n="about.stat3.label"></div>
            </div>
            <div class="stat-card">
              <div class="number" data-i18n="about.stat4.number"></div>
              <div class="label" data-i18n="about.stat4.label"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="worship">
      <div class="container">
        <div class="section-header">
          <span class="section-tag" data-i18n="worship.label"></span>
          <h2 data-i18n="worship.heading"></h2>
        </div>
        <div class="worship-cards">
          <div class="worship-card">
            <div class="day" data-i18n="worship.sunday.day"></div>
            <h3 data-i18n="worship.sunday.title"></h3>
            <p class="time" data-i18n="worship.sunday.time"></p>
            <p data-i18n="worship.sunday.desc"></p>
          </div>
          <div class="worship-card">
            <div class="day" data-i18n="worship.wednesday.day"></div>
            <h3 data-i18n="worship.wednesday.title"></h3>
            <p class="time" data-i18n="worship.wednesday.time"></p>
            <p data-i18n="worship.wednesday.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="ministries">
      <div class="container">
        <div class="section-header">
          <span class="section-tag" data-i18n="ministries.label"></span>
          <h2 data-i18n="ministries.heading"></h2>
        </div>
        <div class="ministries-grid">
          <div class="ministry-card">
            <div class="ministry-icon" aria-hidden="true">&#9733;</div>
            <h3 data-i18n="ministries.youth.title"></h3>
            <p data-i18n="ministries.youth.desc"></p>
          </div>
          <div class="ministry-card">
            <div class="ministry-icon" aria-hidden="true">&#9829;</div>
            <h3 data-i18n="ministries.outreach.title"></h3>
            <p data-i18n="ministries.outreach.desc"></p>
          </div>
          <div class="ministry-card">
            <div class="ministry-icon" aria-hidden="true">&#9835;</div>
            <h3 data-i18n="ministries.music.title"></h3>
            <p data-i18n="ministries.music.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="contact-section">
      <div class="container">
        <div class="section-header">
          <span class="section-tag" data-i18n="contact.label"></span>
          <h2 data-i18n="contact.heading"></h2>
        </div>
        <div class="contact-grid">
          <div class="contact-item">
            <h3 data-i18n="contact.address.label"></h3>
            <p data-i18n="contact.address.value"></p>
          </div>
          <div class="contact-item">
            <h3 data-i18n="contact.phone.label"></h3>
            <p><a href="tel:+15551234567" data-i18n="contact.phone.value"></a></p>
          </div>
          <div class="contact-item">
            <h3 data-i18n="contact.email.label"></h3>
            <p><a href="mailto:info@gracecommunity.org" data-i18n="contact.email.value"></a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer.text"></p>
    </div>
  </footer>
